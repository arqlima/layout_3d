{% load static %}
<!doctype html>
<html lang="pt-br">

  <meta name="theme-color" content="#f4f4f5">
  <title>{{ project.name }} | Visualização arquitetônica</title>
  <link rel="stylesheet" href="{{ viewer_styles_url }}">
</head>
<body class="au-viewer">

  <script type="module" src="{{ viewer_script_url }}"></script>

</html>
