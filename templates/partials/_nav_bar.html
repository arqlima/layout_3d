<nav class="au-nav">
  <a href="{% url 'projects3d:project-list' %}" class="au-wordmark">
    {% include "partials/_icon.html" with name="box" %}
    <span>Rafael Castro <small>Arquitetos</small></span>
  </a>
  {% if user.is_authenticated %}
    <div class="au-account">
      <span>{{ user.first_name|default:user.username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="botao-linha botao-sm">{% include "partials/_icon.html" with name="log-out" %} Sair</button>
      </form>
    </div>
  {% endif %}
</nav>
